# Pin this project to one exact Rust release managed by rustup. CI and the release
# workflow read the version from here, so every build of a tag uses the same compiler
# and a new rustc or lint can't turn CI red on its own; bump it in its own PR. The
# embedded JavaScript shell (boa_engine) needs Rust >= 1.88. rustup reads this file
# and uses the matching toolchain for any cargo/rustc invocation in this directory
# tree, without disturbing a system-wide rustc.
[toolchain]
channel = "1.97.0"
