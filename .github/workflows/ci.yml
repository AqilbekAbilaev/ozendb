name: CI

# Runs the test suites on every PR into main (and on pushes to main) so a
# regression can't merge green. Release bundling lives in release.yml and is
# unaffected by this. Kept to Linux only for a fast, cheap gate — cross-platform
# build coverage already happens at release time.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    name: Frontend tests (Vitest)
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Check file sizes
        run: npm run check:size

      # The release is the only other place the production bundle is built; with no
      # component tests, this is what catches a .vue file that won't compile.
      - name: Build the production bundle
        run: npm run build

  backend:
    name: Backend tests (cargo)
    runs-on: ubuntu-22.04
    env:
      # The Ubuntu packages Tauri needs to build; also the key of their cache below.
      LINUX_PACKAGES: libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev build-essential file
    # Live databases for the integration tests, which skip themselves (and still report
    # `ok`) without them. The SSH tunnel tests need a bastion and stay opt-in.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read the pinned Rust version
        id: rust
        shell: bash
        run: |
          version=$(sed -n 's/^channel *= *"\([^"]*\)".*/\1/p' src-tauri/rust-toolchain.toml)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.version }}
          components: clippy

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Downloading these from Ubuntu's mirror normally takes half a minute but has taken
      # up to 26 when the mirror is slow (#483), so the downloaded files are kept between
      # runs and apt only fetches what changed. apt still installs them as usual.
      - name: Cache Linux system packages
        uses: actions/cache@v6
        with:
          path: ~/apt-archives
          key: apt-ubuntu-22.04-${{ env.LINUX_PACKAGES }}

      - name: Install Linux system dependencies
        run: |
          mkdir -p ~/apt-archives/partial
          # Retry a dropped download, and give up on a stalled connection rather than wait.
          apt_opts="-o Acquire::Retries=3 -o Acquire::http::Timeout=30"
          sudo apt-get update $apt_opts
          sudo apt-get install -y $apt_opts \
            -o Dir::Cache::Archives="$HOME/apt-archives" \
            -o APT::Keep-Downloaded-Packages=true \
            $LINUX_PACKAGES
          # apt runs as root; the cache step saves the files as the runner's user.
          sudo chown -R "$USER" ~/apt-archives

      # Any warning fails the job, so the count can't creep back up.
      - name: Clippy
        working-directory: ./src-tauri
        env:
          RUST_MIN_STACK: '16777216'
        run: cargo clippy --all-targets -- -D warnings

      - name: Run unit tests
        working-directory: ./src-tauri
        env:
          # IntelliShell's boa_engine needs a larger compile-time stack or rustc
          # can overflow while building it (mirrors release.yml).
          RUST_MIN_STACK: '16777216'
          OZENDB_TEST_POSTGRES: 127.0.0.1:5432
          OZENDB_TEST_POSTGRES_USER: postgres
          OZENDB_TEST_POSTGRES_PASSWORD: postgres
          OZENDB_TEST_MONGODB: 127.0.0.1:27017
        run: cargo test
