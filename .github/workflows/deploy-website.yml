name: Rebuild website on release

on:
  release:
    types: [published]
  # Manual fallback for when the site is stale but no release is being made —
  # `gh workflow run deploy-website.yml`. Beats toggling a live release to draft
  # and back just to re-fire the event above.
  workflow_dispatch:

jobs:
  trigger-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Cloudflare Pages deploy
        run: curl -fsSL -X POST "${{ secrets.CLOUDFLARE_DEPLOY_HOOK }}"
