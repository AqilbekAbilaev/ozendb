version: 2
# Weekly, with minor and patch bumps grouped into one PR per ecosystem so the tracker
# isn't flooded. Majors still come one by one, since those need reading.
#
# Each ecosystem waits a few days after a release before proposing it, which gives a
# broken or compromised release time to be reported and withdrawn; majors wait longest.
# The wait applies to version updates only: GitHub never delays a security update,
# which is what we want for a known vulnerability.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 3
    groups:
      actions:
        patterns: ['*']
