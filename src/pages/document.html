<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Edit Document</title>
    <!-- Paint the theme background immediately so the window never flashes before
         theme.css loads. The window is created with the app's theme, which is what
         prefers-color-scheme reports here; the CSP rules out an inline script. -->
    <style>
      html, body { margin: 0; height: 100%; background: #1f2023; }
      @media (prefers-color-scheme: light) { html, body { background: #f4f5f7; } }
    </style>
  </head>
  <body>
    <div id="doc-editor-app"></div>
    <script type="module" src="/src/engines/mongodb/results/documentWindow.js"></script>
  </body>
</html>
